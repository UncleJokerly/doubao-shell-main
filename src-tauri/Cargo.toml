[package]
name = "doubao-shell"
version = "0.1.0"
description = "A lightweight Doubao desktop shell built with Tauri"
authors = ["doubao-shell"]
edition = "2021"

# See more keys at https://tauri.app/reference/config/

[lib]
# The `_lib` suffix avoids clashing with the binary name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "doubao_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = { version = "2.0.0-rc.1" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"
